<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Solar Inventory</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <div class="logo-icon">☀</div>
            <div class="logo-text">Solar Inventory</div>
        </div>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;">
                Sign In
            </button>
        </form>

    </div>
</div>
</body>
</html>
